apiVersion: v1
kind: Namespace
metadata:
  name: mlops-training
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-worker
  namespace: mlops-training
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-orchestrator
  namespace: mlops-training
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-orchestrator
  namespace: mlops-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: training-orchestrator
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: training-orchestrator
