name: Final quality checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python quality
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/training/requirements.txt
          pip install -r apps/inference/requirements.txt
          pip install -r apps/evidently/requirements.txt
          pip install -r requirements-dev.txt
          ruff check apps tests
          black --check apps tests
          pytest tests
      - name: Terraform fmt
        uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
  image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare isolated inference build context
        run: |
          python -m pip install -r apps/inference/requirements.txt
          export BUILD_CONTEXT="$(mktemp -d)"
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> "$GITHUB_ENV"
          cp apps/inference/Dockerfile apps/inference/requirements.txt "$BUILD_CONTEXT/"
          cp -r apps/inference/app "$BUILD_CONTEXT/app"
          python - <<'PY'
          import os
          from pathlib import Path
          import joblib
          from sklearn.datasets import load_iris
          from sklearn.linear_model import LogisticRegression
          data = load_iris()
          model = LogisticRegression(C=2.0, max_iter=500).fit(data.data, data.target)
          destination = Path(os.environ['BUILD_CONTEXT']) / 'model'
          destination.mkdir()
          joblib.dump(model, destination / 'model.joblib')
          PY
      - name: Build inference image without publishing
        run: |
          mkdir -p reports/security
          docker build --pull -t final-inference:ci "$BUILD_CONTEXT"
          docker image inspect final-inference:ci > reports/security/image-inspect.json
      - name: Install verified Trivy release
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan OS and Python dependencies
        run: |
          trivy --version > reports/security/trivy-version.txt
          trivy image --image-src docker --scanners vuln --timeout 10m \
            --format json --output reports/security/trivy-image.json \
            --exit-code 0 final-inference:ci
      - name: Enforce HIGH and CRITICAL vulnerability gate
        run: |
          trivy convert --format table --severity HIGH,CRITICAL \
            --output reports/security/trivy-image.txt reports/security/trivy-image.json
          cat reports/security/trivy-image.txt
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 \
            reports/security/trivy-image.json
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: warn
          retention-days: 14
