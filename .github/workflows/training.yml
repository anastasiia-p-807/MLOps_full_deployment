name: Final training pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-training
  cancel-in-progress: false

jobs:
  test-and-start-training:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/training/requirements.txt
          pip install -r apps/inference/requirements.txt
          pip install -r apps/evidently/requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check apps tests
      - name: Tests
        run: pytest tests
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Start Step Function training pipeline
        env:
          TRAINING_GIT_SHA: ${{ github.sha }}
        run: |
          python apps/training/run_pipeline.py --git-sha "$TRAINING_GIT_SHA"
