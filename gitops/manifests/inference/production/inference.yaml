apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: production
data:
  MODEL_VERSION: "production"
  MODEL_SHA256: "replace-with-production-sha256"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: production
  labels:
    app: inference
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
      environment: production
  template:
    metadata:
      labels:
        app: inference
        environment: production
    spec:
      containers:
        - name: inference
          image: 616150220350.dkr.ecr.eu-central-1.amazonaws.com/final-inference:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: inference
    environment: production
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: inference-quota
  namespace: production
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
