apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: inference
    environment: production
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: inference-public
  namespace: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: inference
    environment: production
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
