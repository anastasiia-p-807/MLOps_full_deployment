apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-config
  namespace: staging
data:
  MODEL_VERSION: "run-e1fcd92b3cb3"
  MODEL_SHA256: "a46e52ece3d61aba16945ce6dfdc1fe9e38ecc61f0a4b19fffe8d6277eed5ba9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: staging
  labels:
    app: inference
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
      environment: staging
  template:
    metadata:
      labels:
        app: inference
        environment: staging
    spec:
      containers:
        - name: inference
          image: 616150220350.dkr.ecr.eu-central-1.amazonaws.com/final-inference:e1fcd92b3cb3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: staging
spec:
  type: ClusterIP
  selector:
    app: inference
    environment: staging
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: inference-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
