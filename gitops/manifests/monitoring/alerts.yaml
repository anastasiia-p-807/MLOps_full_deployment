apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-policy
  namespace: monitoring
data:
  mlops-alerts.json: |
    {
      "apiVersion": 1,
      "groups": [
        {
          "orgId": 1,
          "name": "mlops-platform",
          "folder": "MLOps",
          "interval": "30s",
          "rules": [
            {
              "uid": "mlops-latency",
              "title": "Inference p95 above 500 ms",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "dfxgv53ozzjeoe",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "dfxgv53ozzjeoe"
                    },
                    "expr": "histogram_quantile(0.95, sum by (le) (rate(inference_latency_seconds_bucket{job=\"inference-production\",endpoint=\"/predict\"}[5m]))) and (sum(rate(inference_latency_seconds_count{job=\"inference-production\",endpoint=\"/predict\"}[5m])) > 0)",
                    "instant": true,
                    "range": false,
                    "intervalMs": 15000,
                    "maxDataPoints": 43200
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "refId": "B",
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "type": "math",
                    "expression": "$A > 0.5"
                  }
                }
              ],
              "noDataState": "OK",
              "execErrState": "Error",
              "for": "2m",
              "annotations": {
                "summary": "Production inference p95 exceeds 500 ms"
              },
              "labels": {
                "severity": "warning",
                "service": "inference",
                "environment": "production"
              },
              "isPaused": false
            },
            {
              "uid": "mlops-errors",
              "title": "Inference HTTP 5xx above 1 percent",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "dfxgv53ozzjeoe",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "dfxgv53ozzjeoe"
                    },
                    "expr": "(sum(rate(inference_requests_total{job=\"inference-production\",endpoint=\"/predict\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(inference_requests_total{job=\"inference-production\",endpoint=\"/predict\"}[5m])), 0.000001)",
                    "instant": true,
                    "range": false,
                    "intervalMs": 15000,
                    "maxDataPoints": 43200
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "refId": "B",
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "type": "math",
                    "expression": "$A > 0.01"
                  }
                }
              ],
              "noDataState": "OK",
              "execErrState": "Error",
              "for": "2m",
              "annotations": {
                "summary": "Production inference HTTP 5xx ratio exceeds 1 percent"
              },
              "labels": {
                "severity": "warning",
                "service": "inference",
                "environment": "production"
              },
              "isPaused": false
            },
            {
              "uid": "mlops-drift-demo",
              "title": "Iris demo drift above 0.2",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "dfxgv53ozzjeoe",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "dfxgv53ozzjeoe"
                    },
                    "expr": "evidently_drift_score{source=\"iris_demo\"} and on(job,source,scenario) (time() - evidently_drift_last_success_timestamp_seconds{source=\"iris_demo\"} < 3600)",
                    "instant": true,
                    "range": false,
                    "intervalMs": 15000,
                    "maxDataPoints": 43200
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "refId": "B",
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "type": "math",
                    "expression": "$A > 0.2"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Error",
              "for": "1m",
              "annotations": {
                "summary": "Controlled Iris demo: more than 20 percent of features drifted"
              },
              "labels": {
                "severity": "warning",
                "service": "drift",
                "environment": "demo"
              },
              "isPaused": false
            },
            {
              "uid": "mlops-inference-down",
              "title": "Production inference unavailable",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "dfxgv53ozzjeoe",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "refId": "A",
                    "datasource": {
                      "type": "prometheus",
                      "uid": "dfxgv53ozzjeoe"
                    },
                    "expr": "(1 - up{job=\"inference-production\"}) or absent(up{job=\"inference-production\"})",
                    "instant": true,
                    "range": false,
                    "intervalMs": 15000,
                    "maxDataPoints": 43200
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "refId": "B",
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "type": "math",
                    "expression": "$A > 0.5"
                  }
                }
              ],
              "noDataState": "OK",
              "execErrState": "Error",
              "for": "2m",
              "annotations": {
                "summary": "Prometheus cannot scrape production inference"
              },
              "labels": {
                "severity": "critical",
                "service": "inference",
                "environment": "production"
              },
              "isPaused": false
            }
          ]
        }
      ]
    }
  mlops-datasource.json: |
    {
      "apiVersion": 1,
      "datasources": [
        {
          "name": "prometheus :)",
          "uid": "dfxgv53ozzjeoe",
          "type": "prometheus",
          "access": "proxy",
          "url": "http://prometheus.monitoring.svc.cluster.local:9090",
          "isDefault": true,
          "editable": false,
          "jsonData": {
            "httpMethod": "POST",
            "timeInterval": "15s"
          }
        }
      ]
    }
