apiVersion: v1
data:
  drift_job.py: |
    from __future__ import annotations

    import argparse
    import json
    import os
    import time
    from pathlib import Path

    import pandas as pd
    from evidently import Report
    from evidently.presets import DataDriftPreset
    from prometheus_client import CollectorRegistry, Gauge, push_to_gateway
    from sklearn.datasets import load_iris


    def calculate_drift(reference: pd.DataFrame, current: pd.DataFrame):
        if reference.empty or current.empty:
            raise ValueError("Both datasets must contain rows")
        if list(reference.columns) != list(current.columns):
            raise ValueError("Reference and current columns must match")
        if reference.isna().any().any() or current.isna().any().any():
            raise ValueError("Datasets must not contain missing values")
        snapshot = Report([DataDriftPreset(method="ks", threshold=0.05)]).run(
            current_data=current, reference_data=reference
        )
        result = snapshot.dict()
        counts = [
            metric["value"]
            for metric in result["metrics"]
            if "DriftedColumnsCount" in metric["config"]["type"]
        ]
        if len(counts) != 1:
            raise RuntimeError("Expected one Evidently DriftedColumnsCount result")
        share = float(counts[0]["share"])
        if not 0 <= share <= 1:
            raise RuntimeError("Invalid drift share")
        return snapshot, share


    def main() -> None:
        parser = argparse.ArgumentParser()
        parser.add_argument("--scenario", choices=["baseline", "shifted", "csv"], default="baseline")
        parser.add_argument("--reference", type=Path)
        parser.add_argument("--current", type=Path)
        parser.add_argument("--output-dir", type=Path, default=Path("reports/drift"))
        parser.add_argument(
            "--pushgateway",
            default=os.getenv("PUSHGATEWAY_URL", "http://localhost:9091"),
        )
        parser.add_argument("--no-push", action="store_true")
        args = parser.parse_args()
        if args.scenario == "csv":
            if args.reference is None or args.current is None:
                parser.error("--scenario csv requires --reference and --current")
            reference = pd.read_csv(args.reference)
            current = pd.read_csv(args.current)
            source = "csv"
        else:
            if args.reference is not None or args.current is not None:
                parser.error("CSV paths require --scenario csv")
            reference = load_iris(as_frame=True).data
            current = reference.copy()
            if args.scenario == "shifted":
                # Controlled drift in two of the four features, not production observations.
                current.iloc[:, :2] += 2.0
            source = "iris_demo"

        snapshot, share = calculate_drift(reference, current)
        output = args.output_dir / args.scenario
        output.mkdir(parents=True, exist_ok=True)
        snapshot.save_html(str(output / "report.html"))
        (output / "report.json").write_text(snapshot.json(), encoding="utf-8")
        if not args.no_push:
            registry = CollectorRegistry()
            Gauge(
                "evidently_drift_score", "Share of features with detected data drift", registry=registry
            ).set(share)
            Gauge(
                "evidently_drift_last_success_timestamp_seconds",
                "Unix time of last successful drift computation",
                registry=registry,
            ).set(time.time())
            push_to_gateway(
                args.pushgateway,
                job="evidently_drift",
                grouping_key={"scenario": args.scenario, "source": source},
                registry=registry,
                timeout=30,
            )
        print(
            json.dumps(
                {
                    "event": "drift_report",
                    "scenario": args.scenario,
                    "source": source,
                    "drift_share": share,
                    "report": str(output / "report.html"),
                    "pushed": not args.no_push,
                }
            )
        )


    if __name__ == "__main__":
        main()
  requirements.txt: "evidently==0.7.17\nprometheus-client==0.23.1\npandas==2.3.3\nscikit-learn==1.8.0\r\n"
kind: ConfigMap
metadata:
  name: evidently-drift-script
  namespace: monitoring
