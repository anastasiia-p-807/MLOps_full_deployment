apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-platform
  namespace: mlops-system
spec:
  project: default
  source:
    repoURL: https://github.com/anastasiia-p-807/MLOps_full_deployment.git
    targetRevision: HEAD
    path: gitops/manifests/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
